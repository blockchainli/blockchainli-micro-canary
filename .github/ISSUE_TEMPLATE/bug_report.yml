name: "🐞 Bug Report"
description: "Report a broken feature, API error, or reproducible code bug."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please use this form strictly for reproducible code bugs. For setup help or general questions, visit our [Community Discussions](https://github.com/YOUR-USERNAME/YOUR-DISCUSSIONS-REPO/discussions).

  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Describe the bug clearly and what you expected to happen instead."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "How can we trigger this issue?"
      placeholder: |
        1. Run '...'
        2. Send payload '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant logs or error output"
      description: "Paste any stack traces or error responses (remove all API keys/secrets first)."
      render: shell

  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "OS, Python/Node version, or Docker image tag."
      placeholder: "e.g., Ubuntu 24.04, Python 3.12, Docker"
    validations:
      required: true